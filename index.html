<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17130f"><title>CAFFEINE — Menu</title>
<style>
:root{--bg:#17130f;--panel:#211b15;--cream:#f5ead8;--muted:#b9a991;--gold:#d8a45b;--line:#403326;--green:#25D366}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34251a 0,#17130f 48%);color:var(--cream);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 16px 110px}header{text-align:center;padding:25px 12px 22px;border-bottom:1px solid var(--line)}.logo{width:68px;height:68px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;color:var(--gold);font-size:30px}.kicker{letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-size:11px}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(42px,9vw,68px);letter-spacing:.12em;margin:8px 0}.subtitle{color:var(--muted);font-size:13px;letter-spacing:.08em}.tools{position:sticky;top:0;z-index:5;background:#17130fee;backdrop-filter:blur(12px);padding:14px 0 10px}.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:var(--cream);font-size:15px;outline:none}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0 3px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:30px;padding:9px 14px;font-size:13px}.tabs button.active{background:var(--gold);border-color:var(--gold);color:#21170d;font-weight:700}.section-title{display:flex;align-items:center;gap:12px;margin:27px 0 12px}.section-title h2{font:500 25px Georgia,serif;margin:0}.section-title:after{content:"";height:1px;background:var(--line);flex:1}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{position:relative;overflow:hidden;background:linear-gradient(145deg,#292118,#201a14);border:1px solid var(--line);border-radius:17px;display:flex;flex-direction:column}.photo-wrap{height:170px;position:relative;background:linear-gradient(135deg,#403020,#211811);display:grid;place-items:center;overflow:hidden}.photo{width:100%;height:100%;object-fit:cover;display:block}.item-content{padding:14px;display:flex;justify-content:space-between;gap:10px;flex:1}.item h3{font-size:15px;margin:0 0 6px;font-weight:650}.item p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.price{color:var(--gold);font-weight:700;white-space:nowrap;font-size:14px;text-align:right}.item-bottom{padding:0 14px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.add{border:0;background:var(--gold);color:#21170d;border-radius:22px;padding:9px 15px;font-weight:800;cursor:pointer}.qty{display:flex;align-items:center;gap:10px;color:var(--cream);font-weight:700}.qty button{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:#30251c;color:var(--cream);font-size:18px}.empty{text-align:center;color:var(--muted);padding:30px;display:none}.note{text-align:center;color:var(--muted);font-size:11px;margin-top:36px;line-height:1.7}.cartbar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#211b15f5;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}.cartbar button{width:min(100%,650px);border:0;border-radius:14px;background:var(--gold);color:#21170d;font-weight:800;padding:14px;font-size:15px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#211b15;border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(100%,650px);max-height:85vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}.sheet h2{font:500 25px Georgia,serif;margin:0 0 15px}.close{float:right;background:transparent;border:1px solid var(--line);color:var(--cream);border-radius:20px;padding:6px 12px}.cartline{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.field{width:100%;background:#17130f;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--cream);font-size:15px;margin:7px 0 14px}.total{display:flex;justify-content:space-between;margin:16px 0;font-weight:800;color:var(--gold)}.send{width:100%;border:0;border-radius:13px;background:var(--green);color:#092b14;font-weight:800;padding:14px;font-size:15px}.hint{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:560px){.items{grid-template-columns:1fr}.photo-wrap{height:190px}.wrap{padding-inline:14px}.item-content{padding:13px}.item-bottom{padding:0 13px 13px}}
</style></head><body><div class="wrap"><header><div class="logo">☕</div><div class="kicker">Coffee • Drinks • Moments</div><h1>CAFFEINE</h1><div class="subtitle">NOTRE MENU</div></header>
<div class="tools"><input class="search" id="search" type="search" placeholder="Rechercher un produit…"><nav class="tabs" id="tabs"><button class="active" data-cat="all">Tout</button><button data-cat="Cafés">Cafés</button><button data-cat="Boissons froides">Boissons froides</button><button data-cat="Thés">Thés</button><button data-cat="Milkshakes">Milkshakes</button><button data-cat="Crêpes">Crêpes</button></nav></div><main id="menu"></main><div class="empty" id="empty">Aucun résultat trouvé.</div><footer class="note">CAFFEINE · Merci de votre visite<br>Prix en dinars tunisiens (DT). Les prix non confirmés seront validés au café.</footer></div>
<div class="cartbar"><button id="openCart">🛒 Voir le panier · <span id="cartCount">0</span> article(s)</button></div><div class="modal" id="cartModal"><div class="sheet"><button class="close" id="closeCart">Fermer ✕</button><h2>Votre commande</h2><div id="cartLines"></div><label for="tableNo">Numéro de table</label><input class="field" id="tableNo" type="text" inputmode="numeric" placeholder="Exemple : 5"><div class="total"><span>Total</span><span id="cartTotal">0.000 DT</span></div><p class="hint" id="priceHint">Les articles sans prix confirmé apparaîtront séparément dans votre commande.</p><button class="send" id="sendOrder">Commander sur WhatsApp</button></div></div>
<script>
// Prix repris de la version fournie et des corrections confirmées. null = à confirmer.
const products=[
{cat:'Cafés',name:'Espresso',desc:'Café court et intense',price:null,img:'assets/espresso.jpg',emoji:'☕'},
{cat:'Cafés',name:'Direct',desc:'Café classique',price:null,img:'assets/direct.jpg',emoji:'☕'},
{cat:'Cafés',name:'Americano',desc:'Café allongé',price:4,img:'assets/americano.jpg',emoji:'☕'},
{cat:'Cafés',name:'Capucin',desc:'Café et mousse de lait',price:null,img:'assets/cappuccino.jpg',emoji:'☕'},
{cat:'Cafés',name:'Cappuccino',desc:'Espresso, lait chaud et mousse',price:null,img:'assets/cappuccino.jpg',emoji:'☕'},
{cat:'Cafés',name:'Café crème',desc:'Café doux avec crème de lait',price:null,img:'assets/coffee-cream.jpg',emoji:'☕'},
{cat:'Boissons froides',name:'Eau minérale 1 L',desc:'Bien fraîche',price:2,img:'assets/water.jpg',emoji:'💧'},
{cat:'Boissons froides',name:'Ice Macchiato',desc:'Café glacé',price:5,img:'assets/ice-macchiato.jpg',emoji:'🧋'},
{cat:'Boissons froides',name:'Ice Macchiato Caramel',desc:'Café glacé au caramel',price:6,img:'assets/caramel-ice.jpg',emoji:'🧋'},
{cat:'Boissons froides',name:'Jus de citron',desc:'Jus frais préparé à la demande',price:3.5,img:'assets/lemon-juice.jpg',emoji:'🍋'},
{cat:'Boissons froides',name:'Citronnade',desc:'Citronnade fraîche',price:null,img:'assets/lemonade.jpg',emoji:'🍋'},
{cat:'Boissons froides',name:"Jus d'orange",desc:'Jus frais',price:3,img:'assets/orange-juice.jpg',emoji:'🍊'},
{cat:'Boissons froides',name:'Jus de fraise',desc:'Jus frais à la fraise',price:5,img:'assets/strawberry-juice.jpg',emoji:'🍓'},
{cat:'Boissons froides',name:'Jus kiwi',desc:'Jus frais au kiwi',price:null,img:'assets/kiwi-juice.jpg',emoji:'🥝'},
{cat:'Boissons froides',name:'Lait de poule',desc:'Boisson fraîche',price:7,img:'assets/vanilla-shake.jpg',emoji:'🥛'},
{cat:'Boissons froides',name:'Americano glacé',desc:'Café américain glacé',price:4,img:'assets/iced-americano.jpg',emoji:'🧊'},
{cat:'Boissons froides',name:'Virgin Mojito',desc:'Boisson fraîche à la menthe',price:4,img:'assets/lemonade.jpg',emoji:'🍃'},
{cat:'Boissons froides',name:'Strawberry Mojito',desc:'Mojito à la fraise',price:5,img:'assets/strawberry-juice.jpg',emoji:'🍓'},
{cat:'Boissons froides',name:'Blueberry Mojito',desc:'Mojito aux myrtilles',price:5,img:'assets/kiwi-juice.jpg',emoji:'🫐'},
{cat:'Boissons froides',name:'Piña Colada',desc:'Cocktail exotique',price:7,img:'assets/vanilla-shake.jpg',emoji:'🍍'},
{cat:'Boissons froides',name:'Canette',desc:'Boisson gazeuse',price:3,img:'assets/iced-americano.jpg',emoji:'🥤'},
{cat:'Thés',name:'Thé',desc:'Thé chaud',price:null,img:'assets/coffee-cream.jpg',emoji:'🍵'},
{cat:'Thés',name:'Thé aux amandes',desc:'Thé traditionnel aux amandes',price:null,img:'assets/coffee-cream.jpg',emoji:'🍵'},
{cat:'Milkshakes',name:'Milkshake chocolat',desc:'Lait frappé au chocolat',price:null,img:'assets/caramel-ice.jpg',emoji:'🥤'},

{cat:'Crêpes',name:'Crêpe Fromage',desc:'Crêpe salée au fromage',price:5,img:'assets/crepe-cheese.jpg',emoji:'🥞'},
{cat:'Crêpes',name:'Crêpe Thon Fromage',desc:'Crêpe salée au thon et fromage',price:7,img:'assets/crepe-tuna.jpg',emoji:'🥞'},
{cat:'Crêpes',name:'Crêpe Salée',desc:'Crêpe salée',price:5,img:'assets/crepe-savory.jpg',emoji:'🥞'},
{cat:'Crêpes',name:'Crêpe Salée Fruits Secs',desc:'Crêpe salée aux fruits secs',price:8,img:'assets/crepe-nuts.jpg',emoji:'🥜'},

];
const menu=document.getElementById('menu'),search=document.getElementById('search'),empty=document.getElementById('empty'),cart={};let category='all';const money=v=>Number(v).toFixed(3)+' DT';
function render(){const q=search.value.trim().toLowerCase(),filtered=products.filter(p=>(category==='all'||p.cat===category)&&(`${p.name} ${p.desc} ${p.cat}`).toLowerCase().includes(q));menu.innerHTML='';[...new Set(filtered.map(p=>p.cat))].forEach(cat=>{const section=document.createElement('section'),heading=document.createElement('div');heading.className='section-title';const h=document.createElement('h2');h.textContent=cat;heading.append(h);section.append(heading);const grid=document.createElement('div');grid.className='items';filtered.filter(p=>p.cat===cat).forEach(p=>{const i=products.indexOf(p),card=document.createElement('article');card.className='item';const wrap=document.createElement('div');wrap.className='photo-wrap';const img=document.createElement('img');img.className='photo';img.src=p.img;img.alt=p.name;img.loading='lazy';img.onerror=()=>{wrap.innerHTML='<span class="photo-fallback" style="display:block;font-size:48px">'+p.emoji+'</span>'};wrap.append(img);const content=document.createElement('div');content.className='item-content';const info=document.createElement('div'),name=document.createElement('h3'),desc=document.createElement('p');name.textContent=p.name;desc.textContent=p.desc;info.append(name,desc);const price=document.createElement('div');price.className='price';price.textContent=p.price===null?'Prix à confirmer':money(p.price);content.append(info,price);const bottom=document.createElement('div');bottom.className='item-bottom';const add=document.createElement('button');add.className='add';add.textContent='Ajouter +';add.onclick=()=>{cart[i]=(cart[i]||0)+1;render();updateCart()};bottom.append(add);if(cart[i]){const qty=document.createElement('div');qty.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>{cart[i]--;if(cart[i]<=0)delete cart[i];render();updateCart()};const count=document.createElement('span');count.textContent=cart[i];const plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>{cart[i]++;render();updateCart()};qty.append(minus,count,plus);bottom.append(qty)}card.append(wrap,content,bottom);grid.append(card)});section.append(grid);menu.append(section)});empty.style.display=filtered.length?'none':'block'}
function updateCart(){const count=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cartCount').textContent=count;const lines=document.getElementById('cartLines');lines.innerHTML='';let total=0,unknown=false;Object.keys(cart).forEach(k=>{const p=products[+k],qty=cart[k],line=document.createElement('div');line.className='cartline';const left=document.createElement('span');left.textContent=p.name+' × '+qty;const right=document.createElement('strong');if(p.price===null){right.textContent='Prix à confirmer';unknown=true}else{right.textContent=money(p.price*qty);total+=p.price*qty}line.append(left,right);lines.append(line)});document.getElementById('cartTotal').textContent=money(total)+(unknown?' + prix à confirmer':'');document.getElementById('priceHint').style.display=unknown?'block':'none'}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});search.addEventListener('input',render);document.getElementById('openCart').onclick=()=>{updateCart();document.getElementById('cartModal').classList.add('open')};document.getElementById('closeCart').onclick=()=>document.getElementById('cartModal').classList.remove('open');document.getElementById('cartModal').addEventListener('click',e=>{if(e.target.id==='cartModal')e.currentTarget.classList.remove('open')});document.getElementById('sendOrder').onclick=()=>{const keys=Object.keys(cart);if(!keys.length){alert('Votre panier est vide.');return}const table=document.getElementById('tableNo').value.trim();if(!table){alert('Veuillez indiquer votre numéro de table.');return}let total=0,unknown=false;const rows=keys.map(k=>{const p=products[+k],qty=cart[k];if(p.price===null){unknown=true;return `- ${p.name} x ${qty} (prix à confirmer)`}total+=p.price*qty;return `- ${p.name} x ${qty} = ${money(p.price*qty)}`});const msg=`Bonjour CAFFEINE ☕\nJe souhaite passer cette commande :\n${rows.join('\n')}\n\nTable : ${table}\nTotal : ${money(total)}${unknown?' + articles à prix à confirmer':''}\nMerci !`;window.open('https://wa.me/21629395992?text='+encodeURIComponent(msg),'_blank')};render();updateCart();
</script></body></html>
